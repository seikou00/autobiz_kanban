<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="编码交付报告。交付结论、需求实现、变更、质量验证、Review 与交付追溯。">
  <link rel="icon" href="data:,">
  <title>编码交付报告</title>
  <style>:root {
  color-scheme: light;
  --surface: #f3f6fb;
  --surface-raised: #fff;
  --surface-subtle: #f7f9fd;
  --border: #e4eaf3;
  --text: #172b4d;
  --text-secondary: #526581;
  --muted: #66768e;
  --info: #245ee8;
  --success: #107a4f;
  --warning: #a76109;
  --danger: #c83949;
  --purple: #7551c9;
  --info-bg: #edf3ff;
  --success-bg: #e9f7f0;
  --warning-bg: #fff5e4;
  --danger-bg: #fff0f1;
  --purple-bg: #f3efff;
  --radius: 14px;
  --shadow: 0 4px 20px #21396608;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
  scroll-padding-top: 96px;
}
body {
  min-width: 320px;
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
button,
input,
a {
  font: inherit;
}
button {
  border: 0;
  background: none;
  color: inherit;
  cursor: pointer;
}
a {
  color: inherit;
  text-decoration: none;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
:focus-visible {
  outline: 3px solid #7097ff;
  outline-offset: 4px;
  border-radius: 4px;
}
[hidden] {
  display: none !important;
}
svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.svg-defs {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}
code,
.metric-value,
.hero-percentage,
.ring strong {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-variant-numeric: tabular-nums;
}
.topbar {
  min-height: 76px;
  padding: 12px max(32px, calc((100vw - 1424px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  background: white;
  border-bottom: 1px solid var(--border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: var(--info);
  color: white;
  box-shadow: 0 4px 12px #245ee824;
}
.brand strong {
  display: block;
  font-size: 14px;
  font-weight: 750;
  letter-spacing: 0.08em;
}
.brand small {
  display: block;
  color: var(--muted);
  font-size: 11px;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 24px;
  min-width: 0;
}
.project-label {
  font-size: 12px;
  color: var(--muted);
  text-align: right;
  overflow-wrap: anywhere;
}
.button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 18px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
}
.button-primary {
  background: var(--info);
  color: white;
  flex-shrink: 0;
  box-shadow: 0 3px 8px #245ee819;
}
.button-primary:hover {
  background: #1a4fc9;
}
.app-shell {
  max-width: 1488px;
  margin: 0 auto;
  padding: 28px 32px 48px;
}
.decision-rail {
  margin-bottom: 26px;
}
.delivery-hero {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(220px, 0.8fr) minmax(250px, 1fr);
  gap: 32px;
  padding: 30px 34px;
  border-radius: 18px 18px 0 0;
  color: white;
  background: #14264c;
}
.hero-main,
.hero-progress,
.hero-checks {
  min-width: 0;
}
.hero-eyebrow {
  margin-bottom: 10px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: #9bb6e9;
}
.hero-title-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
h1 {
  margin: 0;
  font-size: clamp(25px, 2.2vw, 34px);
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}
.hero-title-row .status-badge {
  background: #1f4c47;
  color: #93efbd;
  border: 1px solid #357765;
}
.hero-title-row .tone-warning {
  background: #5a4826;
  color: #ffe1a0;
  border-color: #786038;
}
.decision-copy {
  margin-top: 15px;
  max-width: 530px;
  color: #c1cfe7;
  font-size: 13px;
  line-height: 1.85;
  overflow-wrap: anywhere;
}
.hero-meta {
  margin-top: 22px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  color: #9db0cf;
  font-size: 11px;
  overflow-wrap: anywhere;
}
.hero-progress {
  padding: 2px 28px;
  border-inline: 1px solid #ffffff18;
}
.hero-label {
  color: #c1cfe7;
  font-size: 12px;
}
.hero-percentage {
  margin: 4px 0 10px;
  font-size: 42px;
  letter-spacing: -0.045em;
  line-height: 1.25;
  font-weight: 650;
}
.hero-percentage small {
  margin-left: 5px;
  font-size: 20px;
  color: #a8c1ee;
}
.progress-track {
  height: 6px;
  border-radius: 9px;
  background: #ffffff1f;
  overflow: hidden;
}
.progress-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: #64d6ae;
}
.completion-meta {
  margin-top: 8px;
  font-size: 11px;
  color: #b0c2df;
}
.hero-quick-stats {
  display: flex;
  gap: 32px;
  margin-top: 20px;
}
.hero-quick-stats > * {
  text-align: left;
}
.hero-quick-stats strong {
  display: block;
  font-size: 22px;
  font-weight: 650;
  color: #8ee1bb;
  line-height: 1.2;
}
.hero-quick-stats span {
  color: #b0c2df;
  font-size: 10px;
}
.hero-quick-stats .text-warning {
  color: #ffd58b;
}
.hero-checks-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}
.hero-checks-heading strong {
  font-size: 13px;
}
.hero-checks-heading > span {
  font-size: 10px;
  color: #a5b7d6;
}
.gate-list {
  list-style: none;
  display: grid;
  gap: 10px;
}
.gate-list li {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  color: #c9d6ec;
}
.gate-list .status-badge {
  margin-left: auto;
  padding: 1px 7px;
  font-size: 10px;
}
.gate-list .tone-warning {
  color: #ffdc9b;
  background: #ad780f27;
}
.gate-list .tone-success {
  color: #a3edc6;
  background: #168c5036;
}
.gate-list .tone-danger {
  color: #ffb6bc;
  background: #c8394933;
}
.gate-icon {
  display: grid;
  place-items: center;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #ffffff15;
  color: #ffcf80;
  font-weight: 700;
  font-size: 16px;
}
.gate-icon svg {
  width: 12px;
  height: 12px;
}
.gate-icon.passed {
  color: #8ee1bb;
}
.gate-icon.failed {
  color: #ff9ca5;
}
.hero-footnote {
  margin-top: 15px;
  color: #9db0cf;
  font-size: 10px;
}
.attention-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 26px;
  padding: 13px 26px;
  border: 1px solid #e5eaf4;
  border-top: 0;
  border-radius: 0 0 16px 16px;
  background: white;
  box-shadow: var(--shadow);
  font-size: 12px;
  color: var(--text-secondary);
}
.attention-bar > span:first-child {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}
.attention-bar > span:first-child svg {
  width: 16px;
  height: 16px;
  color: var(--warning);
}
.attention-bar b {
  margin-left: 5px;
  color: var(--text);
}
.attention-bar .text-link {
  margin-left: auto;
}
.content-area {
  min-width: 0;
}
.content-topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 18px;
  margin: 0 2px 14px;
  font-size: 11px;
  color: var(--muted);
}
.repo-name {
  flex: 1;
  text-align: center;
  overflow-wrap: anywhere;
}
.updated-at {
  font-size: 10px;
}
.tabs {
  display: flex;
  position: sticky;
  top: 0;
  z-index: 10;
  gap: 20px;
  margin-bottom: 24px;
  padding: 0 24px;
  background: #fffffffa;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.tab {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 59px;
  padding: 0 14px;
  font-size: 13px;
  font-weight: 550;
  color: var(--text-secondary);
}
.tab svg {
  width: 17px;
  height: 17px;
}
.tab:hover {
  color: var(--info);
}
.tab.active {
  color: var(--info);
  font-weight: 650;
}
.tab.active:after {
  content: "";
  height: 3px;
  position: absolute;
  inset: auto 12px 0;
  background: var(--info);
  border-radius: 3px 3px 0 0;
}
.tab-count {
  padding: 1px 7px;
  border-radius: 5px;
  font-size: 10px;
  background: #eef2f8;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tab.active .tab-count {
  background: var(--info-bg);
  color: var(--info);
}
.tab-count.danger {
  background: var(--danger-bg);
  color: var(--danger);
}
.tab-count.warning {
  background: var(--warning-bg);
  color: var(--warning);
}
.report-section {
  min-width: 0;
  padding: 24px 26px;
  margin-bottom: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: white;
  box-shadow: var(--shadow);
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
.section-heading h2 {
  position: relative;
  font-size: 16px;
  font-weight: 650;
  padding-left: 12px;
  line-height: 1.4;
}
.section-heading h2:before {
  content: "";
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 0;
  width: 3px;
  border-radius: 4px;
  background: var(--info);
}
.section-heading > span,
.section-meta {
  font-size: 11px;
  color: var(--muted);
}
.text-link {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  font-size: 11px;
  color: var(--info);
  font-weight: 550;
}
.text-link svg {
  width: 14px;
  height: 14px;
}
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.metric {
  min-width: 0;
  padding: 22px 24px 18px;
  background: #f7faff;
  border: 1px solid #e7eefb;
  border-radius: 12px;
  border-top: 3px solid #3a70ed;
}
.metric-page {
  background: #f4fbfc;
  border-color: #dfedf1;
  border-top-color: #2095a7;
}
.metric-aiLines {
  background: #faf8ff;
  border-color: #eae5f8;
  border-top-color: #8868d4;
}
.metric-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
}
.metric-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--info);
  background: #eaf0ff;
}
.metric-icon svg {
  width: 18px;
  height: 18px;
}
.metric-page .metric-icon {
  color: #1e8495;
  background: #e4f4f7;
}
.metric-aiLines .metric-icon {
  color: var(--purple);
  background: #eee8fc;
}
.metric-value {
  margin: 10px 0 12px;
  color: var(--info);
  font-size: 41px;
  line-height: 1.1;
  letter-spacing: -0.04em;
  font-weight: 650;
}
.metric-page .metric-value {
  color: #147d8e;
}
.metric-aiLines .metric-value {
  color: var(--purple);
}
.metric-value small {
  margin-left: 5px;
  font-family: inherit;
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
}
.metric-breakdown {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  color: var(--muted);
  font-size: 11px;
}
.metric-breakdown strong {
  color: var(--text-secondary);
  font-weight: 600;
}
.metric-subnote {
  margin-top: 10px;
  color: var(--muted);
  font-size: 10px;
}
.metric-foot {
  margin-top: 17px;
  padding-top: 12px;
  border-top: 1px solid #dfe7f2;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  align-items: center;
}
.metric-foot .row-open {
  font-size: 10px;
  text-decoration: none;
}
.status-badge,
.issue-badge,
.change-tag,
.operation {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 5px;
  white-space: nowrap;
  font-size: 11px;
  line-height: 1.6;
  font-weight: 550;
}
.tone-neutral {
  background: #eef2f7;
  color: #64758d;
}
.tone-success,
.issue-fixed {
  background: var(--success-bg);
  color: var(--success);
}
.tone-warning {
  background: var(--warning-bg);
  color: var(--warning);
}
.tone-danger {
  background: var(--danger-bg);
  color: var(--danger);
}
.overview-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  margin-top: 22px;
}
.data-section {
  padding: 20px 22px;
  border: 1px solid var(--border);
  border-radius: 12px;
}
.data-section .section-heading h2 {
  font-size: 13px;
  padding: 0;
}
.data-section h2:before {
  display: none;
}
.data-section .section-heading {
  margin-bottom: 16px;
}
.ring-summary {
  display: flex;
  align-items: center;
  gap: 24px;
}
.ring {
  position: relative;
  width: 98px;
  height: 98px;
  flex: none;
  display: grid;
  place-items: center;
}
.ring > svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.ring circle {
  fill: none;
  stroke-width: 7;
}
.ring-bg {
  stroke: #edf1f7;
}
.ring-value {
  stroke: var(--info);
  stroke-dasharray: var(--dash);
  stroke-linecap: round;
}
.data-completion .ring-value {
  stroke: var(--success);
}
.ring strong {
  font-size: 22px;
  letter-spacing: -0.05em;
}
.ring-copy {
  flex: 1;
  min-width: 0;
}
.ring-copy-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 4px 0;
  font-size: 11px;
  color: var(--muted);
}
.ring-copy-row strong {
  color: var(--text);
  font-weight: 600;
}
.chart-note {
  margin-top: 9px;
  text-align: right;
}
.brief-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}
.brief-card {
  min-width: 0;
  padding-right: 22px;
  border-right: 1px solid var(--border);
}
.brief-card:last-child {
  border: 0;
  padding: 0;
}
.brief-card > h3 {
  display: inline-flex;
  color: var(--info);
  padding: 3px 8px;
  border-radius: 5px;
  background: var(--info-bg);
  font-size: 11px;
  font-weight: 600;
}
.brief-card:nth-child(2) > h3 {
  color: #137d8d;
  background: #eaf6f8;
}
.brief-card:nth-child(3) > h3 {
  color: var(--purple);
  background: var(--purple-bg);
}
.document-section {
  min-width: 0;
  margin-top: 16px;
}
.document-section h3 {
  font-size: 12px;
  font-weight: 600;
}
.document-text {
  margin-top: 7px;
  font-size: 12px;
  line-height: 1.9;
  color: var(--text-secondary);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.source-caption {
  display: block;
  margin-top: 8px;
  font-size: 10px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.brief-more summary {
  font-size: 11px;
  color: var(--info);
  margin-top: 6px;
}
.artifact-sections {
  margin-top: 12px;
}
.section-note {
  margin: -6px 0 18px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.8;
}
.risk-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}
.risk-tile {
  min-width: 0;
  padding: 18px;
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface-subtle);
  border-radius: 10px;
}
.risk-tile:hover {
  border-color: #a8bee8;
}
.risk-tile.has-findings {
  background: var(--warning-bg);
  border-color: #f0d8af;
}
.risk-tile-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-secondary);
}
.risk-tile svg {
  width: 14px;
  height: 14px;
  color: var(--muted);
}
.risk-tile strong {
  display: block;
  margin-top: 11px;
  font-size: 24px;
  line-height: 1.3;
  color: #5c7090;
}
.risk-tile.has-findings strong {
  color: var(--warning);
}
.risk-tile small {
  display: block;
  font-size: 10px;
  font-weight: 400;
  color: var(--muted);
  margin-top: 7px;
}
.table-wrap {
  width: 100%;
  min-width: 0;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 9px;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  text-align: left;
  font-size: 12px;
}
.data-table th {
  padding: 12px 14px;
  background: #f3f6fc;
  color: #64758d;
  font-size: 11px;
  font-weight: 550;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.data-table td {
  padding: 16px 14px;
  vertical-align: top;
  border-bottom: 1px solid #edf1f7;
  overflow-wrap: anywhere;
  line-height: 1.8;
  color: var(--text-secondary);
}
.data-table tr:last-child td {
  border-bottom: 0;
}
.data-table tbody tr:hover {
  background: #fafcff;
}
.row-open {
  color: var(--info);
  text-align: left;
  font-size: inherit;
  font-weight: 550;
  overflow-wrap: anywhere;
}
.row-open:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}
.entry-button {
  text-align: left;
  font-size: 11px;
  color: var(--info);
  overflow-wrap: anywhere;
}
.entry-button code {
  word-break: break-word;
  font-size: 11px;
  line-height: 1.8;
}
.entry-service {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 10px;
}
.method-pill {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  margin-right: 6px;
  border-radius: 4px;
  background: var(--info-bg);
  color: var(--info);
}
.method-get {
  color: #13845c;
  background: var(--success-bg);
}
.method-delete {
  color: var(--danger);
  background: var(--danger-bg);
}
.operation-added {
  color: var(--success);
  background: var(--success-bg);
}
.operation-modified {
  color: var(--info);
  background: var(--info-bg);
}
.operation-deleted {
  color: var(--danger);
  background: var(--danger-bg);
}
.change-contract {
  background: var(--purple-bg);
  color: var(--purple);
}
.change-implementation {
  background: var(--info-bg);
  color: var(--info);
}
.cell-note {
  font-size: 10px;
  color: var(--muted);
  margin-top: 6px;
}
.call-chain {
  font-size: 10px;
  color: #597090;
  line-height: 1.9;
  margin-top: 6px;
  overflow-wrap: anywhere;
}
.file-summary {
  display: grid;
  gap: 4px;
}
.file-summary code {
  font-size: 10px;
  color: #62738b;
}
.file-summary small {
  font-size: 10px;
  color: var(--muted);
}
.kind-label {
  font-size: 11px;
  color: var(--muted);
}
.evidence-list {
  margin: 0;
  padding-left: 17px;
}
.evidence-list li {
  margin: 2px 0 6px;
}
.evidence-list .evidence-list {
  margin-top: 4px;
}
.empty-state {
  padding: 24px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  background: #fafcff;
  border-radius: 8px;
}
.stage-row {
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 9px;
  margin-bottom: 10px;
  background: #fff;
}
.stage-row:last-child {
  margin: 0;
}
.stage-row > summary {
  cursor: pointer;
  font-size: 12px;
  font-weight: 550;
  color: var(--text-secondary);
}
.stage-row[open] > summary {
  color: var(--info);
  margin-bottom: 16px;
}
.stage-row .table-wrap {
  border-color: #eaf0f8;
}
.stage-row details:not(.stage-row) summary {
  cursor: pointer;
  font-size: 11px;
  color: var(--info);
}
.task-progress {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 30px;
  padding: 22px 26px;
  margin-bottom: 20px;
  border-radius: 11px;
  background: #f0f6ff;
  border: 1px solid #e0eafc;
}
.task-progress h3 {
  font-size: 14px;
  margin-bottom: 14px;
  font-weight: 600;
}
.stacked-bar {
  height: 7px;
  background: #dfe8f6;
  border-radius: 10px;
  overflow: hidden;
}
.stacked-bar span {
  display: block;
  height: 100%;
  background: #3c78ed;
  border-radius: inherit;
}
.task-score {
  text-align: right;
}
.task-score strong {
  display: block;
  font-size: 29px;
  color: var(--info);
  line-height: 1.3;
}
.task-score span {
  font-size: 11px;
  color: var(--muted);
}
.filter-bar {
  margin: 18px 0;
}
.filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.filter-button {
  min-height: 33px;
  padding: 4px 12px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 7px;
  font-size: 11px;
  color: var(--text-secondary);
}
.filter-button.active {
  background: var(--info-bg);
  border-color: #bfd1fb;
  color: var(--info);
  font-weight: 600;
}
.coverage-hero {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 22px;
}
.coverage-main {
  background: var(--surface-subtle);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 24px;
}
.coverage-label {
  color: var(--text-secondary);
  font-size: 12px;
}
.coverage-number {
  color: var(--info);
  font-size: 44px;
  line-height: 1.4;
  font-weight: 650;
}
.coverage-number small {
  font-size: 18px;
  margin-left: 3px;
}
.coverage-bars {
  display: grid;
  gap: 13px;
  margin-top: 10px;
}
.coverage-bar-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 11px;
  color: var(--muted);
}
.coverage-bar-label strong {
  font-weight: 550;
  color: var(--text-secondary);
}
.coverage-bar-track {
  background: #e4eaf3;
  height: 5px;
  margin-top: 6px;
  border-radius: 7px;
  overflow: hidden;
}
.coverage-bar-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: #6893ed;
}
.test-counts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: center;
  gap: 12px;
}
.test-count {
  padding: 20px 10px;
  text-align: center;
  border-radius: 10px;
  background: var(--surface-subtle);
  border: 1px solid var(--border);
}
.test-count strong {
  font-size: 29px;
  display: block;
  color: var(--text);
}
.test-count span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 6px;
}
.test-count small {
  display: block;
  margin-top: 12px;
  font-size: 10px;
}
.subtabs {
  display: flex;
  gap: 26px;
  border-bottom: 1px solid var(--border);
  margin-top: 22px;
}
.subtab {
  min-height: 44px;
  font-size: 12px;
  color: var(--muted);
  border-bottom: 2px solid transparent;
}
.subtab.active {
  color: var(--info);
  font-weight: 600;
  border-color: var(--info);
}
.coverage-legend {
  margin: 18px 0;
  font-size: 12px;
  color: var(--muted);
}
.risk-overview {
  display: grid;
  grid-template-columns: 1.2fr repeat(6, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 22px;
}
.risk-overview-main {
  padding: 18px;
  border-radius: 10px;
  color: var(--warning);
  background: var(--warning-bg);
  border: 1px solid #f1dcb9;
}
.risk-overview-main span {
  font-size: 11px;
}
.risk-overview-main strong {
  display: block;
  margin-top: 5px;
  font-size: 25px;
  line-height: 1.4;
}
.risk-stat {
  padding: 18px 12px;
  text-align: center;
  border-radius: 10px;
  background: #f7f9fc;
  border: 1px solid var(--border);
}
.risk-stat strong {
  display: block;
  font-size: 25px;
  line-height: 1.4;
  color: #8a9ab0;
}
.risk-stat span {
  display: block;
  margin-top: 7px;
  font-size: 10px;
  color: var(--muted);
}
.risk-stat.stat-reviewFixed.has-value {
  background: var(--success-bg);
  border-color: #cbeada;
}
.risk-stat.stat-reviewFixed.has-value strong {
  color: var(--success);
}
.risk-stat.stat-reviewFindings.has-value strong {
  color: var(--info);
}
.risk-stat.stat-nonBlocking.has-value strong {
  color: var(--warning);
}
.risk-stat.stat-p0.has-value {
  background: var(--danger-bg);
  border-color: #f6cdd2;
}
.risk-stat.stat-p0.has-value strong,
.risk-stat.stat-p1.has-value strong {
  color: var(--danger);
}
.page-footer {
  max-width: 1488px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin: 0 auto;
  padding: 22px 32px 30px;
  font-size: 10px;
  color: var(--muted);
  border-top: 1px solid var(--border);
}
.report-dialog {
  width: min(660px, 100%);
  max-width: 100vw;
  height: 100dvh;
  max-height: 100dvh;
  margin: 0 0 0 auto;
  border: 0;
  border-left: 1px solid var(--border);
  padding: 26px 30px;
  color: var(--text);
  background: white;
  overflow: auto;
  box-shadow: -12px 0 40px #10244819;
}
.report-dialog::backdrop {
  background: #132c5359;
  backdrop-filter: blur(2px);
}
.report-dialog #close {
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 4px 12px;
  min-height: 33px;
  float: right;
  font-size: 12px;
  color: var(--text-secondary);
}
.report-dialog h2 {
  clear: both;
  padding-top: 24px;
  margin-bottom: 24px;
  font-size: 21px;
  overflow-wrap: anywhere;
}
.report-dialog dt {
  margin-top: 17px;
  font-size: 11px;
  color: var(--muted);
}
.report-dialog dd {
  margin-top: 5px;
  font-size: 12px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.report-dialog dd dl {
  padding: 10px 14px;
  border-radius: 8px;
  background: var(--surface-subtle);
}
.report-dialog ul {
  margin-left: 4px;
}
@media (max-width: 1100px) {
  .delivery-hero {
    grid-template-columns: 1.25fr 1fr;
    gap: 24px;
  }
  .hero-progress {
    border-right: 0;
  }
  .hero-checks {
    grid-column: 1/-1;
    border-top: 1px solid #ffffff18;
    padding-top: 20px;
  }
  .hero-checks-heading {
    margin-bottom: 12px;
  }
  .gate-list {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }
  .gate-list li {
    flex-wrap: wrap;
  }
  .gate-list .status-badge {
    margin-left: 26px;
  }
  .hero-footnote {
    margin-top: 10px;
  }
  .risk-overview {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .risk-overview-main {
    grid-column: 1/-1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
  }
  .risk-overview-main strong {
    margin: 0;
  }
  .metric {
    padding: 18px;
  }
  .coverage-hero {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 760px) {
  .topbar {
    padding: 12px 20px;
  }
  .project-label {
    display: none;
  }
  .app-shell {
    padding: 20px;
  }
  .delivery-hero {
    padding: 24px;
    gap: 22px;
  }
  .hero-progress {
    padding-right: 0;
    padding-left: 22px;
  }
  .hero-quick-stats {
    gap: 20px;
  }
  .brief-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .brief-card {
    padding: 0 0 20px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
  .risk-strip {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .metrics-grid {
    gap: 12px;
  }
  .metric-foot {
    align-items: flex-start;
    flex-direction: column;
  }
  .metric-value {
    font-size: 33px;
  }
  .metric-top {
    font-size: 12px;
  }
  .metric-icon {
    width: 26px;
    height: 26px;
  }
  .metric-icon svg {
    width: 14px;
    height: 14px;
  }
  .metric-breakdown {
    gap: 4px 10px;
  }
  .tabs {
    gap: 4px;
    padding: 0 8px;
    justify-content: space-between;
  }
  .tab {
    font-size: 12px;
    gap: 6px;
    padding: 0 10px;
  }
  .tab-count {
    display: none;
  }
  .content-topline .repo-name {
    flex-basis: 100%;
    text-align: left;
    order: 3;
  }
  .overview-grid {
    gap: 12px;
  }
  .ring-summary {
    gap: 14px;
  }
  .data-section {
    padding: 18px;
  }
  .ring {
    width: 80px;
    height: 80px;
  }
  .ring strong {
    font-size: 18px;
  }
  .report-section {
    padding: 22px 20px;
  }
}
@media (max-width: 540px) {

  }

  .brand-mark {

  .tabs,

    display: none;
  }
  .delivery-hero {
    print-color-adjust: exact;
  }
  .report-section {
    break-inside: avoid;
    box-shadow: none;
  }
  .tab-panel[hidden] {
    display: block !important;
  }
  .app-shell {
    max-width: none;
    padding: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}

/* Developer console: concise verdict, focused detail views, local interaction trails. */
:root {
  color-scheme: dark;
  --surface: #080f1e;
  --surface-raised: #111d30;
  --surface-subtle: #15243a;
  --border: #263951;
  --text: #edf4ff;
  --text-secondary: #b0bfd6;
  --muted: #8b9db7;
  --info: #6bb9ff;
  --success: #5de0ae;
  --warning: #ffc77e;
  --danger: #ff829b;
  --purple: #b5a0ff;
  --info-bg: #193455;
  --success-bg: #143d34;
  --warning-bg: #453522;
  --danger-bg: #452536;
  --purple-bg: #30284e;
  --shadow: 0 12px 40px #00000018;
}
body {
  background: var(--surface);
}
.ambient-bg {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse at 0 0, #24435f44, transparent 50%),
    radial-gradient(ellipse at 100% 20%, #3d285c2b, transparent 48%),
    linear-gradient(#12213c12 1px, transparent 1px), linear-gradient(90deg, #12213c12 1px, transparent 1px);
  background-size:
    auto,
    auto,
    48px 48px,
    48px 48px;
}
.topbar {
  background: #0c1628e8;
  border-bottom-color: #273b555e;
  min-height: 70px;
  backdrop-filter: blur(18px);
}
.brand-mark {
  background: #173c65;
  color: #7cc9ff;
  border: 1px solid #39729f;
  box-shadow: 0 0 24px #54b7ff12;
}
.brand strong {
  letter-spacing: 0.12em;
  font-size: 12px;
}
.brand small {
  font-size: 10px;
}
.button-primary {
  background: #215382;
  color: #e9f6ff;
  border: 1px solid #4581b0;
  box-shadow: none;
}
.button-primary:hover {
  background: #2b6597;
}
.app-shell {
  max-width: 1488px;
  padding-top: 22px;
}
.content-topline {
  margin: 0 2px 18px;
  justify-content: flex-start;
  gap: 10px 20px;
}
.feature-name {
  font-size: 15px;
  color: var(--text);
  font-weight: 600;
}
.updated-at {
  margin-left: auto;
}
.tabs {
  background: #101d30ed;
  border-color: #2c405c;
  padding: 0 16px;
  gap: 12px;
  margin-bottom: 22px;
  backdrop-filter: blur(18px);
}
.tab {
  min-height: 57px;
  padding-inline: 14px;
  color: #99acc8;
  font-size: 12px;
}
.tab.active {
  color: #8acbff;
}
.tab.active:after {
  background: #6bb9ff;
  box-shadow: 0 -2px 18px #70c2ff66;
}
.tab-count {
  background: #22334c;
  color: #a9bdd9;
}
.tab-count:empty {
  display: none;
}
.tab-count.warning {
  background: #493820;
  color: #ffcc86;
}
.report-section {
  background: #101c2ef5;
  border-color: #273b55;
  padding: 24px;
  box-shadow: none;
}
.section-heading h2 {
  font-size: 15px;
}
.section-heading h2:before {
  background: #65b5f7;
  box-shadow: 0 0 12px #65b5f73d;
}
.tab-panel.active {

@media print {
  body {
    background: white;
    color: #1b2f4b;
  }
  .ambient-bg,
  .activity-panel {
    display: none;
  }
  .report-section,
  .home-conclusion {
    background: white;
    color: #1b2f4b;
  }
  .tab-panel[hidden] {
    display: block !important;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

.feature-name {
  min-width: 0;
  overflow-wrap: anywhere;
}
@media (min-width: 761px) {
  .home-conclusion {
    padding: 28px 34px;
  }
  .eyebrow {
    margin-bottom: 16px;
  }
  .verdict-readouts > div {
    grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 0 14px;
    padding: 14px 0;
  }
  .verdict-readouts .status-badge,
  .verdict-readouts .text-link {
    grid-column: auto;
    justify-self: end;
  }
}

/* SVG telemetry: source-linked, offline and motion-aware. */
.brand-mark {
  position: relative;
  overflow: hidden;
  background: linear-gradient(145deg, #204f76, #163149);
  box-shadow:
    0 0 24px #66bfff15,
    inset 0 0 16px #76bfff0a;
}
.brand-mark:after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid #7fc9ff25;
  border-radius: 8px;
  pointer-events: none;
}
.home-conclusion {
  background: linear-gradient(112deg, #132e47 0%, #111f36 55%, #222344 100%);
  border-color: #467194;
  box-shadow:
    0 0 0 1px #68c4ff08,
    inset 0 1px #9bd7ff0a,
    0 14px 48px #00000024;
}
.home-conclusion:before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(#62baff04 1px, transparent 1px), linear-gradient(90deg, #62baff04 1px, transparent 1px);
  background-size: 24px 24px;
  mask-image: linear-gradient(90deg, transparent, #000);
  pointer-events: none;
}
.verdict-telemetry {
  min-width: 0;
  border-left: 1px solid #52759540;
  padding-left: 28px;
}
.telemetry-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: #97bbdb;
}
.telemetry-label svg {
  width: 15px;
  height: 15px;
  color: #79cbff;
}
.telemetry-label > span {
  margin-left: auto;
  letter-spacing: 0;
  font-size: 9px;
  color: #819dbd;
}
.telemetry-footer {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 16px;
  padding-top: 9px;
  margin-top: 6px;
  border-top: 1px solid #4c709236;
  color: #9eb5ce;
  font-size: 10px;
}
.telemetry-footer b {
  font:
    11px/1.6 "SFMono-Regular",
    Consolas,
    monospace;
  color: #cce8ff;
  margin-left: 5px;
}
.telemetry-footer .status-badge {
  font-size: 9px;
  padding: 2px 7px;
  margin-left: auto;
}
.kpi-tile {
  background: linear-gradient(130deg, #12273e, #102034);
  border-color: #304e6c;
  box-shadow: inset 0 1px #9ed5ff06;
}
.kpi-tile > span {
  justify-content: flex-start;
  gap: 8px;
}
.kpi-tile > span > svg {
  margin-left: auto;
}
.kpi-tile em {
  font-style: normal;
}
.kpi-symbol {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border: 1px solid #386486;
  border-radius: 7px;
  background: #1b3a55;
  color: #8bcfff;
}
.kpi-symbol svg {
  width: 14px;
  height: 14px;
  color: inherit;
}
.kpi-delivered .kpi-symbol {
  color: #8ee8c2;
  background: #193e37;
  border-color: #366957;
}
.kpi-open .kpi-symbol {
  color: #f5d2a0;
  background: #3c342a;
  border-color: #6e563b;
}
.kpi-page .kpi-symbol {
  color: #a1e2eb;
  background: #1a3a42;
  border-color: #37636d;
}
.report-chart {
  min-width: 0;
  position: relative;
  margin: 0;
}
.donut-chart {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.donut-visual {
  position: relative;
  flex: 0 0 174px;
  width: 174px;
  height: 174px;
}
.donut-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  fill: none;
  transform: rotate(-90deg);
}
.donut-track {
  stroke: #31475d;
  stroke-width: 12px;
  opacity: 0.62;
}
.donut-inner {
  fill: #0b1b2f52;
  stroke: #6bb9ff17;
  stroke-width: 0.8px;
}
.donut-orbit {
  fill: none;
  stroke: #7ebde85c;
  stroke-width: 0.7px;
  stroke-dasharray: 0.6 4;
  transform-origin: 90px 90px;
  animation: telemetry-orbit 34s linear infinite;
}
.donut-arc {
  fill: none;
  stroke-width: 12px;
  stroke-linecap: round;
  filter: drop-shadow(0 0 4px #6bb9ff25);
  animation: donut-draw 1.15s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  transition:
    stroke-width 0.18s,
    filter 0.18s;
}
.donut-hotspot {
  cursor: pointer;
}
.donut-hotspot:hover .donut-arc,
.donut-hotspot:focus-visible .donut-arc {
  stroke-width: 16px;
  filter: drop-shadow(0 0 8px #a9dfff77);
}
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.donut-center strong {
  color: #def3ff;
  font:
    500 30px/1.2 "SFMono-Regular",
    Consolas,
    monospace;
  letter-spacing: -0.04em;
  text-shadow: 0 0 16px #84cbff20;
}
.donut-center strong small {
  margin-left: 3px;
  font-size: 13px;
  color: #8eb7d8;
}
.donut-center > span {
  margin-top: 7px;
  font-size: 10px;
  color: #91acc6;
  text-align: center;
  max-width: 95px;
}
.donut-legend {
  flex: 1;
  min-width: 0;
  max-width: 240px;
}
.chart-legend-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 28px;
  padding: 3px 5px;
  border-radius: 5px;
  font-size: 10px;
  color: #aec3da;
  text-align: left;
}
.chart-legend-item:hover,
.chart-legend-item:focus-visible {
  background: #25476580;
}
.chart-legend-item > i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex: none;
  background: var(--series-color);
  box-shadow: 0 0 8px color-mix(in srgb, var(--series-color), transparent 65%);
}
.chart-legend-item > strong {
  margin-left: auto;
  font:
    11px/1.5 "SFMono-Regular",
    Consolas,
    monospace;
  color: #e1efff;
}
.chart-caption {
  display: block;
  margin-top: 10px;
  color: #86a3bf;
  font-size: 9px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}
.donut-legend .chart-caption {
  font-size: 9px;
  margin: 7px 5px 0;
}
.chart-tooltip {
  position: absolute;
  left: 50%;
  top: 4px;
  z-index: 5;
  max-width: calc(100% - 12px);
  transform: translateX(-50%);
  padding: 7px 10px;
  border: 1px solid #5988ad;
  border-radius: 6px;
  background: #0b1c30f7;
  box-shadow: 0 4px 18px #00000033;
  color: #c4e6ff;
  font-size: 10px;
  white-space: normal;
  pointer-events: none;
}
.home-chart .line-chart {
  margin-top: -3px;
}
.review-bar-list {
  max-height: 280px;
  overflow-y: auto;
  padding: 5px 3px 5px 0;
}
.review-bar-row {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr) 68px;
  gap: 12px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid #20364c;
}
.review-bar-label > button {
  color: #c3def6;
  background: transparent;
  border: 0;
  font-size: 12px;
}
.review-bar-label small {
  display: block;
  color: #8b9db8;
  font-size: 9px;
}
.review-bar-label .review-coverage-partial {
  color: #ffd08a;
}
.review-bar-track {
  display: flex;
  align-items: stretch;
  height: 25px;
  border-radius: 5px;
  overflow: hidden;
  background: #13283a;
}
.review-bar-segment {
  width: var(--segment-width);
  min-width: 0;
  padding: 0;
  border: 0;
  border-right: 1px solid #0a1b2d;
  color: #0a1c2d;
  font-size: 11px;
  font-weight: 700;
  background: var(--segment-color);
  transform-origin: left;
  animation: review-bar-in 0.7s ease-out both;
}
.review-bar-segment:hover,
.review-bar-segment:focus-visible {
  filter: brightness(1.15);
}
.review-bar-empty {
  color: #8b9db8;
  font-size: 9px;
  padding: 4px 8px;
  white-space: nowrap;
}
.review-advisory-count {
  padding: 4px;
  border: 1px solid #544b78;
  border-radius: 5px;
  background: #262a42;
  color: #cbb6ff;
  font-size: 10px;
}
.risk-filter-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: #93aec8;
  font-size: 11px;
  margin: 12px 0;
}
.review-current {
  margin: 4px 0;
}
.risk-table .data-table th:nth-child(1) {
  width: 52%;
}
.risk-table .data-table th:nth-child(2) {
  width: 23%;
}
.risk-table .data-table th:nth-child(3) {
  width: 14%;
}
.risk-table .data-table th:nth-child(4) {
  width: 11%;
}
.risk-table .data-table td {
  padding: 14px 16px;
  vertical-align: middle;
}
.risk-summary-open {
  display: block;
  width: 100%;
  text-align: left;
  color: #cee2f6;
}
.risk-excerpt {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  max-height: 5.25em;
  font-size: 12px;
  line-height: 1.75;
  font-weight: 550;
  overflow-wrap: anywhere;
}
.risk-read-more {
  display: block;
  color: #7fc9ff;
  font-size: 10px;
  margin-top: 6px;
}
.risk-summary-open:hover .risk-read-more {
  text-decoration: underline;
  text-underline-offset: 3px;
}
.risk-summary-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  color: #8fa8c2;
  font-size: 10px;
  margin-top: 8px;
}
.risk-category {
  padding: 1px 7px;
  border: 1px solid #34506d;
  border-radius: 4px;
  background: #192e45;
  color: #adcae6;
}
.risk-scope-main {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  color: #c4d9ec;
  font-weight: 550;
}
.risk-scope-main > span {
  color: #91a9c3;
  font-size: 11px;
  font-weight: 400;
}
.risk-scope-meta {
  color: #8099b4;
  font-size: 10px;
  margin-top: 6px;
  overflow-wrap: anywhere;
}
.risk-severity {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
}
.risk-blocking {
  font-size: 11px;
  color: #99b0c8;
}
.risk-blocking.is-blocking {
  color: #ff9aac;
}
@media (max-width: 760px) {
  .risk-table .data-table td {
    padding: 5px 0;
    vertical-align: top;
  }
  .risk-table .data-table td:not(:first-child):before {
    display: block;
    margin: 4px 0;
  }
  .risk-summary-meta {
    margin-bottom: 6px;
  }
}
@keyframes review-bar-in {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .review-bar-segment {
    animation: none;
  }
}
@media (max-width: 600px) {
  .review-bar-row {
    grid-template-columns: 62px minmax(0, 1fr) 57px;
    gap: 6px;
  }
  .review-bar-label > button {
    font-size: 11px;
  }
  .review-bar-empty {
    font-size: 8px;
    padding: 5px;
  }
  .risk-filter-summary {
    align-items: flex-start;
  }
}
.chart-layer-legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px 12px;
  font-size: 9px;
  color: #95b5d5;
  margin-bottom: 5px;
}
.chart-layer-legend > span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chart-layer-legend > button {
  padding: 2px 7px;
  font-size: 9px;
  border: 1px solid #3c5f80;
  background: #203951;
  color: #badbfa;
  border-radius: 4px;
}
.chart-layer-legend > button[aria-pressed="false"] {
  background: transparent;
  color: #738aa5;
  border-color: #304256;
  text-decoration: line-through;
}
.series-dot {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
}
.series-planned {
  background: #b8a0f2;
}
.series-added {
  background: #69e4b1;
}
.series-deleted {
  background: #ff849f;
}
.line-svg {
  display: block;
  width: 100%;
  height: auto;
  min-height: 120px;
  overflow: visible;
}
.chart-grid line {
  stroke: #42627e42;
  stroke-width: 0.75;
  stroke-dasharray: 3 5;
}
.chart-grid text,
.chart-axis-label {
  fill: #7c9ab7;
  font:
    9px "SFMono-Regular",
    Consolas,
    monospace;
  stroke: none;
}
.chart-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.line-planned {
  stroke: #b4a0e3;
  stroke-width: 1.5;
  stroke-dasharray: 1.2 1.2;
  opacity: 0.8;
}
.line-delivered {
  stroke: #6fd8f2;
  stroke-width: 2.3;
  stroke-dasharray: none;
  stroke-dashoffset: 0;
  filter: drop-shadow(0 0 3px #61d2f23a);
  animation: line-trace 1.2s ease-out both;
}
.line-area {
  stroke: none;
  animation: chart-fade 1.1s ease-out both;
}
.line-point-halo {
  fill: #65d6fa12;
  stroke: none;
}
.line-point {
  fill: #112941;
  stroke: #9ae7ff;
  stroke-width: 1.7;
}
.line-hotspot {
  cursor: pointer;
}
.line-hotspot:hover .line-point-halo,
.line-hotspot:focus-visible .line-point-halo {
  fill: #71d8f039;
}
.line-hotspot:hover .line-point {
  fill: #a7ecff;
}
.home-chart .chart-caption {
  margin-top: 1px;
}
.analytics-grid {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 22px;
}
.chart-card {
  min-width: 0;
  padding: 18px 20px;
  border: 1px solid #2e4b69;
  border-radius: 11px;
  background: linear-gradient(140deg, #13273d, #112034);
}
.chart-card > h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 550;
  margin-bottom: 12px;
  color: #b8cfe5;
}
.chart-card > h3 > svg {
  width: 16px;
  height: 16px;
  color: #7cb9e7;
}
.source-bars {
  padding-top: 8px;
}
.source-bar-row {
  display: grid;
  grid-template-columns: minmax(75px, 1fr) minmax(0, 2.4fr) 55px;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  width: 100%;
  text-align: left;
  border-bottom: 1px solid #31506a40;
}
.source-bar-row > span:first-child {
  font-size: 10px;
  color: #a2bdd5;
  overflow-wrap: anywhere;
}
.source-bar-tracks {
  display: grid;
  gap: 6px;
  min-width: 0;
}
.source-bar-tracks > i {
  display: block;
  width: var(--bar-width);
  min-width: 0;
  height: 5px;
  border-radius: 4px;
  transform-origin: left;
  animation: bar-reveal 0.9s ease-out both;
}
.bar-added {
  background: linear-gradient(90deg, #319f81, #78e6bc);
  box-shadow: 0 0 8px #56cda51a;
}
.bar-deleted {
  background: linear-gradient(90deg, #b45577, #f6a0b4);
}
.source-bar-row > strong {
  display: grid;
  gap: 3px;
  font-size: 10px;
  font-weight: 400;
  text-align: right;
}
.source-bar-row em {
  font-style: normal;
  font-family: "SFMono-Regular", Consolas, monospace;
  color: #84d9bb;
}
.source-bar-row em + em {
  color: #d498ae;
}
.chart-empty {
  min-height: 160px;
  display: grid;
  place-items: center;
  color: #829bb7;
  font-size: 11px;
}
.chart-zero-grid {
  position: absolute;
  inset: 24px 8px;
  border-bottom: 1px solid #3a5470;
  background: repeating-linear-gradient(transparent 0, transparent 29px, #34506c40 30px);
  pointer-events: none;
  opacity: 0.5;
}
.chart-empty figcaption {
  position: relative;
  padding: 9px;
  background: #102034e8;
  border-radius: 5px;
}
.review-dashboard {
  display: grid;
  grid-template-columns: minmax(320px, 0.9fr) minmax(0, 1.6fr);
  gap: 20px;
  align-items: stretch;
  margin-bottom: 22px;
}
.review-dashboard .risk-overview {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin: 0;
}
.review-dashboard .risk-overview-main {
  grid-column: 1/-1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
}
.review-dashboard .risk-overview-main strong {
  margin: 0;
  font-size: 22px;
}
.review-dashboard .risk-stat {
  padding: 14px 10px;
}
.review-dashboard .chart-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.review-dashboard .donut-chart {
  gap: 12px;
}
.flow-dot svg {
  width: 14px;
  height: 14px;
}
@keyframes telemetry-orbit {
  to {
    transform: rotate(360deg);
  }
}
@keyframes donut-draw {
  from {
    stroke-dasharray: 0 100;
    stroke-dashoffset: var(--arc-offset);
  }
  to {
    stroke-dasharray: var(--arc-size) 100;
    stroke-dashoffset: var(--arc-offset);
  }
}
@keyframes line-trace {
  from {
    clip-path: inset(0 100% 0 0);
  }
  to {
    clip-path: inset(0 0 0 0);
  }
}
@keyframes chart-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes bar-reveal {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@media (min-width: 1101px) {
  .home-conclusion {
    grid-template-columns: minmax(0, 1.5fr) minmax(390px, 1fr);
    gap: 32px;
  }
}
@media (max-width: 1100px) {
  .verdict-telemetry {
    padding-left: 24px;
  }
  .donut-visual {
    flex-basis: 150px;
    width: 150px;
    height: 150px;
  }
  .donut-chart {
    gap: 10px;
  }
  .analytics-grid {
    grid-template-columns: 1fr 1fr;
  }
  .review-dashboard {
    grid-template-columns: 1fr;
  }
  .review-dashboard .chart-card > .donut-chart {
    max-width: 520px;
    width: 100%;
    align-self: center;
  }
  .telemetry-footer {
    gap: 7px 10px;
  }
}
@media (max-width: 760px) {
  .verdict-telemetry {
    border-left: 0;
    border-top: 1px solid #52759540;
    padding: 20px 0 0;
  }
  .verdict-telemetry .donut-chart {
    max-width: 450px;
    margin: 0 auto;
  }
  .donut-visual {
    flex-basis: 170px;
    width: 170px;
    height: 170px;
  }
  .analytics-grid {
    grid-template-columns: 1fr;
  }
  .chart-card .donut-chart {
    max-width: 470px;
    margin: 0 auto;
  }
  .telemetry-footer {
    justify-content: center;
  }
  .telemetry-footer .status-badge {
    margin-left: 0;
  }
  .line-svg {
    min-height: 0;
  }
}
@media (max-width: 540px) {
  .donut-visual {
    flex-basis: 142px;
    width: 142px;
    height: 142px;
  }
  .donut-chart {
    gap: 10px;
  }
  .donut-center strong {
    font-size: 27px;
  }
  .donut-center > span {
    font-size: 9px;
    max-width: 80px;
  }
  .chart-legend-item {
    font-size: 9px;
    min-height: 27px;
    padding: 2px;

// Offline SVG charts. Values are current delivery facts; no synthetic time series.
const ReportCharts = (() => {

      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],

function taskDonut() {
  const tasks = report.tasks;

    { name: "已交付", color: chartPalette.green, detail: { tasks: tasks.filter((t) => t.delivered) } },

function batchReviewChart() {
  const reviews = report.quality.checks.filter((c) => c.type === "Batch Review");
  const rows = report.batches.map((batch) => {
    const review = reviews.find((c) => c.batch === batch.id);

    return {
      name: batch.id,
      complete: Boolean(review?.verified && review.historyComplete && review.history?.length),
      segments: [

function releaseConclusion() {
  const failedEngineering = report.quality.checks.some((c) => c.status === "failed");
  const blocking =
    report.risks.some((r) => isOpen(r) && (r.blocksWorkflow === true || r.level === "P0")) ||
    integration.items.some((item) => item.active && item.status === "blocked");
  if (
    failedEngineering ||
    report.gates.some((g) => g.status === "failed") ||
    report.audits.some((a) => a.passed === false) ||
    blocking
  )
    return {
      status: "failed",
      badge: "存在阻断",
      title: "暂不具备发布条件",
      reason: "已有检查或问题记录存在阻断项，请先闭环后重新核对交付证据。",
      tab:
        failedEngineering || report.gates.some((g) => g.status === "failed")
          ? "tests"
          : report.audits.some((a) => a.passed === false)
            ? "audit"
            : "risks",
      action: "查看阻断与检查",
    };
  if (!report.tasks.length)
    return {
      status: "pending",
      badge: "证据待补齐",
      title: "当前证据不足，暂无法判断",
      reason: "尚无可核验的任务交付结论。缺失数值按 0 展示，具体原因可在交付追溯中查看。",
      tab: "audit",
      action: "查看数据来源",
    };
  if (!report.tasks.every((t) => t.delivered))
    return {
      status: "partial",
      badge: "部分交付",
      title: "交付尚未全部完成",
      reason: report.narrative.summary,
      tab: "plan",
      action: "查看未完成任务",
    };
  if (
    !report.gates.length ||
    report.gates.some((g) => g.status !== "passed") ||
    dataGaps.length ||
    coverageNotes.length ||
    report.risks.some(isOpen) ||
    integration.items.some((item) => item.active && item.status === "unverified") ||
    !report.audits.length ||
    report.audits.some((a) => a.passed !== true) ||
    report.workspaceSync.some((s) => !["synced", "skipped"].includes(s.status))
  )
    return {
      status: "pending",
      badge: "编码已交付 · 验证待补齐",
      title: "编码交付完成，发布仍需验证",
      reason:
        "已交付 " +
        metric("delivered") +
        " 项任务，当前仍有未闭环事项或待核验来源。上线结论以完整发布检查为依据。",
      tab: "tests",
      action: "查看质量验证",
    };
  return {
    status: "passed",
    badge: "交付证据已闭环",
    title: "可进入发布评估",
    reason: "当前已提供的交付、审计与发布检查均已闭环；本报告统计截止 Code，实际发布状态仍由后续流程记录。",
    tab: "audit",
    action: "查看交付证据",
  };
}

function recordAction(tab, action, target) {

  const event = {
    time: Date.now(),
    action: String(action).slice(0, 40),
    target: String(target).slice(0, 256),
  };
  const previous = activities[tab].at(-1);
  if (
    previous &&
    previous.action === event.action &&
    previous.target === event.target &&
    event.time - previous.time < 400

function enhancePanel(panel) {

  if (outline) {
    outline.disabled = documentMode !== "preview";
    for (const heading of panel.querySelectorAll("#document-reader [data-md-slug]")) {
      const option = document.createElement("option");
      option.value = heading.dataset.mdSlug;
      option.textContent = heading.textContent;
      outline.appendChild(option);
    }
  }
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  for (const element of panel.querySelectorAll("[data-count]")) {
    const end = Number(element.dataset.count);
    if (reduced || !Number.isFinite(end) || !end || element.dataset.animated) continue;
    element.dataset.animated = "true";
    const begin = performance.now();
    const frame = (now) => {
      if (!element.isConnected || panel.hidden) {
        element.textContent = end;
        return;
      }
      const progress = Math.min(1, (now - begin) / 650);
      element.textContent = Math.round(end * (1 - Math.pow(1 - progress, 3)));
      if (progress < 1) requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
}
