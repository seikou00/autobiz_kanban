<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="编码交付报告。交付结论、需求实现、变更、质量验证、Review 与交付追溯。">
  <link rel="icon" href="data:,">
  <title>编码交付报告</title>
  <style>{{STYLE}}</style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 19h16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-6 9c-.7 1.2.1 3 1.7 3h12.6c1.6 0 2.4-1.8 1.7-3l-6-9V3M8 15h8"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5M12 18h.01"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4M18 9h4m-4 6h4M10 10h4v4h-4z"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="7" cy="5" r="2"/><circle cx="17" cy="6" r="2"/><circle cx="7" cy="19" r="2"/><path d="M7 7v10m10-9c0 5-10 2-10 7"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 10 5-10 5L2 8l10-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2 12h5l3-8 4 16 3-8h5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M6 15l5-5 4 3 6-8"/><circle cx="11" cy="10" r="1"/></symbol>
    <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="m12 12 7-7M12 3v3M3 12h3m6 6v3m6-9h3"/><circle cx="12" cy="12" r="1"/></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="#overview" aria-label="返回交付总览顶部">
      <span class="brand-mark"><svg><use href="#i-chip"/></svg></span>
      <span><strong>AI DELIVERY</strong><small>研发交付 · 证据驱动</small></span>
    </a>
    <div class="topbar-actions">
      <span class="project-label" id="project"></span>
      <button class="button button-primary" id="exportBtn" type="button">
        <svg><use href="#i-download"/></svg><span>导出摘要</span>
      </button>
    </div>
  </header>

  <main class="app-shell" id="top">
    <section class="content-area" aria-label="交付明细">
      <div class="content-topline" id="versions"></div>
      <nav class="tabs" role="tablist" aria-label="研发交付报告视图">
        <button class="tab active" id="tab-overview" role="tab" aria-selected="true" aria-controls="panel-overview" data-tab="overview" tabindex="0" type="button"><svg aria-hidden="true"><use href="#i-radar"/></svg>交付结论<span class="tab-count" aria-hidden="true"></span></button>
        <button class="tab" id="tab-plan" role="tab" aria-selected="false" aria-controls="panel-plan" data-tab="plan" tabindex="-1" type="button"><svg aria-hidden="true"><use href="#i-layers"/></svg>需求与实现<span class="tab-count" aria-hidden="true"></span></button>
        <button class="tab" id="tab-changes" role="tab" aria-selected="false" aria-controls="panel-changes" data-tab="changes" tabindex="-1" type="button"><svg aria-hidden="true"><use href="#i-branch"/></svg>变更记录<span class="tab-count" aria-hidden="true"></span></button>
        <button class="tab" id="tab-tests" role="tab" aria-selected="false" aria-controls="panel-tests" data-tab="tests" tabindex="-1" type="button"><svg aria-hidden="true"><use href="#i-flask"/></svg>质量验证<span class="tab-count" aria-hidden="true"></span></button>
        <button class="tab" id="tab-risks" role="tab" aria-selected="false" aria-controls="panel-risks" data-tab="risks" tabindex="-1" type="button"><svg aria-hidden="true"><use href="#i-shield"/></svg>Review 闭环<span class="tab-count" aria-hidden="true"></span></button>
        <button class="tab" id="tab-audit" role="tab" aria-selected="false" aria-controls="panel-audit" data-tab="audit" tabindex="-1" type="button"><svg aria-hidden="true"><use href="#i-chip"/></svg>交付追溯<span class="tab-count" aria-hidden="true"></span></button>
      </nav>

      <div class="tab-panels">
        <section class="tab-panel active" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"></section>
        <section class="tab-panel" id="panel-plan" role="tabpanel" aria-labelledby="tab-plan" tabindex="0" hidden></section>
        <section class="tab-panel" id="panel-changes" role="tabpanel" aria-labelledby="tab-changes" tabindex="0" hidden></section>
        <section class="tab-panel" id="panel-tests" role="tabpanel" aria-labelledby="tab-tests" tabindex="0" hidden></section>
        <section class="tab-panel" id="panel-risks" role="tabpanel" aria-labelledby="tab-risks" tabindex="0" hidden></section>
        <section class="tab-panel" id="panel-audit" role="tabpanel" aria-labelledby="tab-audit" tabindex="0" hidden></section>
      </div>
    </section>
  </main>

  <footer class="page-footer"><span>编码交付报告</span><span>统计截止 Code 阶段 · 缺数显示 0，结论保留证据状态。</span></footer>
  <dialog id="details" class="report-dialog" aria-labelledby="detail-heading">
    <button id="close" type="button" class="button" autofocus>关闭</button><h2 id="detail-heading"></h2><div id="detail-body"></div>
  </dialog>
  <script type="application/json" id="report-data">{{REPORT}}</script>
  <script>{{SCRIPT}}</script>
</body>
</html>
